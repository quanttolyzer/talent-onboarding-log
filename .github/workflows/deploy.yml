name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ── Backend: trigger Render deploy ────────────────────────────
  deploy-backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        # Add RENDER_DEPLOY_HOOK_URL in GitHub → Settings → Secrets
        # Get the hook URL from: Render dashboard → your service → Settings → Deploy Hook

  # ── Frontend: Vercel auto-deploys via GitHub integration ──────
  # No action needed here — Vercel auto-deploys when you connect the repo
  # This job just confirms CI passed
  confirm-frontend:
    name: Frontend (Vercel auto-deploys)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Vercel picks up the push automatically via GitHub integration"
