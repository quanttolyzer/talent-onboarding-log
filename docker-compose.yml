version: '3.9'

services:

  # ── PostgreSQL ──────────────────────��─────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talentapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-talent_onboarding}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-run all migrations on first container start (idempotent IF NOT EXISTS)
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./backend/database/add-missing-schema.sql:/docker-entrypoint-initdb.d/01-add-missing.sql:ro
      - ./backend/database/migration-dropdown-tables.sql:/docker-entrypoint-initdb.d/02-dropdown.sql:ro
      - ./backend/database/migration-phase1.sql:/docker-entrypoint-initdb.d/03-phase1.sql:ro
      - ./backend/database/migration-phase2.sql:/docker-entrypoint-initdb.d/04-phase2.sql:ro
      - ./backend/database/migration-phase3.sql:/docker-entrypoint-initdb.d/05-phase3.sql:ro
      - ./backend/database/migration-phase4.sql:/docker-entrypoint-initdb.d/06-phase4.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talentapp} -d ${POSTGRES_DB:-talent_onboarding}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talent-network

  # ── Backend ────────────────────────────────���──────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # development = no SSL on DB connection (correct for local postgres container)
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-talentapp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-talent_onboarding}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Must match the domain/IP where the app is accessed (used for CORS)
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - talent-network

  # ── Frontend (nginx) ────────────────────────────��─────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Relative URL — nginx proxies /api/ to backend, so no host needed
        VITE_API_URL: /api/v1
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - talent-network

networks:
  talent-network:
    driver: bridge

volumes:
  postgres_data:
